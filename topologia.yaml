name: ga-roteamento
topology:
  nodes:
    # Roteadores
    r1: { kind: linux, image: "quay.io/frrouting/frr:master" }
    r2: { kind: linux, image: "quay.io/frrouting/frr:master" }
    r3: { kind: linux, image: "quay.io/frrouting/frr:master" }
    r4: { kind: linux, image: "quay.io/frrouting/frr:master" }
    r5: { kind: linux, image: "quay.io/frrouting/frr:master" }
    
    # Redes de Acesso (Computadores clientes)
    pc1: { kind: linux, image: "alpine:latest" }
    pc2: { kind: linux, image: "alpine:latest" }
    pc3: { kind: linux, image: "alpine:latest" }
    pc4: { kind: linux, image: "alpine:latest" }
    pc5: { kind: linux, image: "alpine:latest" }

  links:
    # Links entre roteadores (Anel + Caminhos redundantes)
    - endpoints: ["r1:eth1", "r2:eth1"]
    - endpoints: ["r2:eth2", "r3:eth1"]
    - endpoints: ["r3:eth2", "r4:eth1"]
    - endpoints: ["r4:eth2", "r5:eth1"]
    - endpoints: ["r5:eth2", "r1:eth2"]
    - endpoints: ["r1:eth3", "r3:eth3"]
    - endpoints: ["r2:eth3", "r5:eth3"]
    
    # Conexão das redes de acesso aos roteadores
    - endpoints: ["r1:eth4", "pc1:eth1"]
    - endpoints: ["r2:eth4", "pc2:eth1"]
    - endpoints: ["r3:eth4", "pc3:eth1"]
    - endpoints: ["r4:eth4", "pc4:eth1"]
    - endpoints: ["r5:eth4", "pc5:eth1"]
